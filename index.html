<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- مضاف: عشان المتصفح يعرف إن الموقع بيدعم الدارك -->
    <meta name="color-scheme" content="light dark" />
    <title>wagt</title>
    <!-- مضاف: بيطبّق الدارك قبل ما الصفحة تترسم (يمنع الوميض الأبيض) -->
    <script>
      try {
        var t = localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <!-- مضاف: خلفية فورية للـ html لحد ما Tailwind يتحمّل -->
    <style>
      html.dark { background: #020617; }
      html:not(.dark) { background: #f1f5f9; }
    </style>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
